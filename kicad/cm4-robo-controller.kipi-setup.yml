import_notes:
- 'Q1: several DC-resistance figures printed; the highest of each is used'
- 'Rail V_MOTOR: fed from J1''s output Net-(J1-Pad1) through Q1, F1'
- 'U11 (12V): load switch, imported as a DC connection from Net-(C24-Pad1) to /power/EFUSE_OUT, not a
  regulator'
- 'Q3: several DC-resistance figures printed; the highest of each is used'
- 'Q2: several DC-resistance figures printed; the highest of each is used'
- 'Q2: only a maximum DC resistance is printed; it is used'
- 'U15 5V: remote sense at R42[2] (FB) on /5V'
- 'L2: inside U15''s regulation loop, so its DC resistance lowers nothing (its loss is in the efficiency);
  modeled as a short'
- 'A1 (RC_5V): efficiency not read from its datasheet; solved lossless, so its input current and the rail
  feeding it are understated'
- 'A1 (RC_5V): output accuracy not known: no accuracy figure in the part''s model'
- 'U4: several DC-resistance figures printed; the highest of each is used'
- 'U4 (VBUS): load switch, imported as a DC connection from /5V to /CM4/usb/VBUS, not a regulator'
- 'NT1: DC resistance not known; modeled as a short'
- 'Capacitor models (AC): 0 added and 0 filled in by part number (by value and ESL where none is given),
  with their ESL; 0 have no ESR in the file, to be entered before an AC sweep'
- 'Capacitor ESL (AC): not published by the maker, a substitute is used for SA11AM101A19R15XXX (C45, C7)
  3 nH, molded case 7343: NIC Components NTC-T datasheet ESL by case (the maker publishes none)'
- 'Capacitor AC values (AC): the maker''s own figure is used but questionable for 1 capacitor model:

  CC0603KRX7R9BB104 (7 parts): Yageo''s own figure gives ESL 1.65 nH (resonance 12.1 MHz); TDK C1608X7R1H104K080AA''s
  measured file gives 0.67 nH (19.9 MHz), 2.5 times lower - the maker''s figure is used, and is questionable'
- 'No supply voltage range is stated for these ICs, so they are not judged PASS / FAIL; enter it on the
  Loads tab when known: U18, U12 (GPS/V_BCKP)'
- 'Output accuracy from the datasheets (a worst-case solve runs each VRM at its low end): U15 5V 5.103
  to 5.224 V at 60 C'
- 'Maximum currents and resistances are kept for a worst-case solve (beside Solve): 26 loads, 4 DC connections'
